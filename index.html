<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="shortcut icon" href="a9270e72dcb0663bd8d4.ico" type="image/x-icon">
  <title>
    Basic Todo List
  </title>
<script defer src="main.bundle.js"></script></head>

<body>
  <div class="main-content">
    <h2>Todo List</h2>
    <div class="input-container">
      <input type="text" id="task-name" placeholder="Add New Task">
      <button class="button-primary" id="create-btn">
        <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
          width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 12h14m-7 7V5" />
        </svg>
      </button>
    </div>
    <ul id="task-list">
    </ul>
  </div>
  <div class="menu">
    <div class="menu-container">
      <div class="menu-top">
        <span class="title-medium">Menu</span>
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
        </svg>
      </div>
      <div class="menu-by-date">
        <span class="title-small">Tasks</span>
        <div>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            viewBox="4 1 16 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m7 16 4-4-4-4m6 8 4-4-4-4" />
          </svg>
          <span class="">Upcoming</span>
        </div>
        <div>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            viewBox="2 2 21 21">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
              d="M9 8h10M9 12h10M9 16h10M4.99 8H5m-.02 4h.01m0 4H5" />
          </svg>
          <span>Today</span>
        </div>
        <div>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4l3 3M3.22302 14C4.13247 18.008 7.71683 21 12 21c4.9706 0 9-4.0294 9-9 0-4.97056-4.0294-9-9-9-3.72916 0-6.92858 2.26806-8.29409 5.5M7 9H3V5" />
          </svg>
          <span>Past</span>
        </div>
      </div>
      <div class="menu-by-list">
        <span class="title-small">Lists</span>
        <div id="create-list-btn">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
              d="M5 12h14m-7 7V5" />
          </svg>
          <span>Add New List</span>
        </div>
      </div>
      <div class="menu-bottom">

      </div>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-content">
      <span class="title-medium">Add Task</span>
      <input type="text" id="task-name-1" placeholder="Task Name">
      <textarea name="task-description" id="task-description" placeholder="Task Description"></textarea>
      <div class="task-datetime-container">
        <span>Due date</span>
        <input type="date" name="task-date" id="task-date">
        <input type="number" name="task-hour" id="task-hour" min="0" max="23" value="00" placeholder="HH">
        <span>:</span>
        <input type="number" name="task-minute" id="task-minute" min="0" max="59" value="00" placeholder="mm">
      </div>
      <div class="task-priority-container">
        <span>Priority</span>
        <div class="dropdown">
          <button class="button-tertiary" id="dropdown-btn">
            <span>Select Priority</span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m8 10 4 4 4-4" />
            </svg>
          </button>
          <div class="dropdown-container">
            <div class="option">
              Urgent
            </div>
            <div class="option">
              Very High
            </div>
            <div class="option">
              High
            </div>
            <div class="option">
              Medium
            </div>
            <div class="option">
              Low
            </div>
          </div>
        </div>
      </div>
      <div class="sidebar-button-container">
        <button class="button-tertiary" id="cancel-create">Cancel</button>
        <button class="button-primary" id="save-task">Save Task</button>
      </div>

    </div>
  </div>
</body>

</html>
